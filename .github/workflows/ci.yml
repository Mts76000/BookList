name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  NODE_ENV: test

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Catches build/prerender regressions before deploy (lib/env.ts is validated at build
      # time, so the test env provides the required vars).
      - name: Build
        run: |
          set -a; . ./.env.test.example; set +a
          npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Production dependencies: blocks on any high/critical advisory not in AUDIT_ALLOWLIST.
      # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, no patched release as of 2026-11) only reaches
      # the production tree through vitest, an *optional* peer of better-auth: npm marks it
      # devOptional, which `--omit=dev` alone does not drop, but it is never installed in
      # production. Remove the entry once picomatch ships a fix.
      - name: npm audit (production, high+)
        env:
          AUDIT_ALLOWLIST: GHSA-fc5q-39xc-vjpf
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const report = JSON.parse(require("fs").readFileSync("audit.json", "utf8"));
            if (report.error) { console.error(report.error.summary); process.exit(1); }
            const allow = new Set(process.env.AUDIT_ALLOWLIST.split(/\s+/).filter(Boolean));
            const blocking = new Map();
            for (const v of Object.values(report.vulnerabilities ?? {}))
              for (const a of v.via)
                if (typeof a === "object" && ["high", "critical"].includes(a.severity)) {
                  const id = a.url.split("/").pop();
                  if (!allow.has(id)) blocking.set(id, `${a.name}: ${a.title} (${a.url})`);
                }
            for (const line of blocking.values()) console.error(line);
            console.log(`${blocking.size} blocking advisory(ies), allowlist: ${[...allow].join(", ")}`);
            process.exit(blocking.size ? 1 : 0);
          '
      # All dependencies: blocks on critical only. Accepted high, dev-only advisory:
      # braces (via eslint-config-next > fast-glob), which has no patched release and is
      # only reached with glob patterns from our own ESLint config — never user input.
      # (esbuild via drizzle-kit is patched through `overrides` in package.json.)
      - run: npm audit --audit-level=critical

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Full-history scan via the gitleaks CLI directly, not gitleaks-action: the action
      # always computes a commit range from the push event's before/after SHAs (no way to
      # override), which breaks on a repo's very first push (before-SHA has no parent to
      # diff against) — exactly the situation every project created from this template
      # starts from. A plain `gitleaks detect` scans the whole history unconditionally.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --redact -v --source .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booklist_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Copy .env.test
        run: cp .env.test.example .env.test
      - run: npm run test:coverage
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booklist_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Copy .env.test
        run: cp .env.test.example .env.test
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
