name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://booklist:booklist_password@localhost:5432/booklist"
      NEXTAUTH_SECRET: "ci-secret"
      NEXTAUTH_URL: "http://localhost:3000"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booklist
          POSTGRES_PASSWORD: booklist_password
          POSTGRES_DB: booklist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booklist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
