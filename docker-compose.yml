services:
  postgres:
    image: postgres:15-alpine
    container_name: booklist-postgres
    restart: always
    environment:
      POSTGRES_USER: booklist
      POSTGRES_PASSWORD: booklist_password
      POSTGRES_DB: booklist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
